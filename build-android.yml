name: Build Voxel3D Android APK

on:
  workflow_dispatch:      # run it by hand from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Logic tests (fail fast if the game rules are broken)
        run: |
          g++ -std=c++17 -O1 -I. tests/test_logic.cpp -o logic_tests
          ./logic_tests

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, build tools, NDK and CMake
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: ./scripts/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxel3D-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Voxel3D-android-build-logs
          path: |
            android-app/app/build/reports/**
            android-app/app/.cxx/**/*.txt
            android-app/app/.cxx/**/*.log
          if-no-files-found: ignore
