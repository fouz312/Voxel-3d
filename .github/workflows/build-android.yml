name: Build Voxel3D Android APK

on:
  push:
    branches:
      - main
      - "copilot/**"
    paths:
      - "**.cpp"
      - "**.h"
      - "**.cmake"
      - "CMakeLists.txt"
      - "scripts/**"
      - ".github/workflows/build-android.yml"

  pull_request:
    paths:
      - "**.cpp"
      - "**.h"
      - "**.cmake"
      - "CMakeLists.txt"
      - "scripts/**"
      - ".github/workflows/build-android.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run C++ logic tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -I. test_logic.cpp -o logic_tests
          ./logic_tests

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_android.sh

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -f android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxel3D-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Voxel3D-android-build-logs
          path: |
            android-app/app/build/reports/**
            android-app/app/.cxx/**/*.txt
            android-app/app/.cxx/**/*.log
          if-no-files-found: ignore
